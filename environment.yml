name: cstar-forge-v0
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Core install/build tooling
  - black
  - bottleneck
  - cartopy
  - click>=8.0.0 # needed for debugging, though higher than 8.3 breaks in combination with c-star/typer
  - cmake
  - cmocean
  # - compilers
  - coolname
  - copernicusmarine
  - coverage
  - dask
  - dask-jobqueue
  - distributed
  - esmpy
  - f90nml  # cstar-forge runtime dep; needed because cstar-forge is pip-installed with --no-deps
  - ffmpeg
  - flake8
  - fakeredis<2.35
  - gcm_filters>=0.5.1
  - gcsfs
  - gsw
  - gdown
  - h5py
  - holoviews
  - ipykernel
  - ipywidgets
  - jinja2  # cstar-forge runtime dep (pip-installed with --no-deps); also a transitive jupyter dep
  - jupyter-book
  - jupyterlab
  - jupyter_client
  - libpnetcdf
  - matplotlib
  #- mpich - optional, will be installed by prompt, prefer open-mpi on linux
  - nc-time-axis
  # - netcdf-fortran - optional, will be installed by prompt
  - netcdf4
  - networkx>=3.6.1
  - numba>=0.61.2
  - numpy[version=">2,<2.3"]
  - packaging
  - pandas
  - papermill
  - pip
  - pooch
  - pop-tools
  - pre-commit==3.8.0
  - pyamg
  - pyco2sys
  - pydantic[version=">2,<3"]
  - prefect>=3.6.1
  - psutil>=7.2.2  # C-Star runtime dep; listed here because C-Star is pip-installed with --no-deps
  - pytimeparse>=1.1.8
  - pytest>=7.0.0
  - pytest-asyncio>=1.3.0
  - pytest-cov>=4.0.0
  - pytest-xdist>=3.0.0
  - pyyaml>=6.0
  - python-dateutil>=2.8.2
  - python-dotenv
  - pyyaml
  - quarto
  - rasterio
  - redis-py
  - regionmask
  - rioxarray
  - rsync
  - ruff>=0.12.2
  - scipy
  - seawater
  - snakeviz
  - typer<=0.25
  - types-python-dateutil>=2.9.0
  - types-pytz>=2025.2.0
  - types-pyyaml>=6.0.12
  - types-requests>2.32.4
  - voila
  - xarray[version=">=2022.6.0,<2025.8.0"]
  - xesmf
  - xgcm>=0.9.0
  - zarr
  # Source the full ROMS-Tools transitive dependency closure from conda-forge.
  # Forge now targets roms-tools 4.x (see --roms-tools-ref); conda-forge has no 4.x
  # yet, so this resolves to the newest 3.x for its dependency closure. The exact
  # version is unimportant because dev-setup.sh overwrites the roms-tools *package*
  # (not its deps) with a git build via `pip install --no-deps`. Keep this so
  # --no-deps has every dep present.
  - roms-tools>=3.4.0,<5
  # The roms-tools and cstar-ocean *packages* are (re)installed from GitHub by
  # dev-setup.sh (or CI) via `pip install --no-deps` after the conda env is created,
  # so pip never resolves/replaces conda-forge dependencies. See --roms-tools-ref /
  # --c-star-ref in dev-setup.sh.
