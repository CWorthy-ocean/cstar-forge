# See docs at: https://mystmd.org/guide/frontmatter
version: 1

project:
  title: C-STAR Forge
  description: "Create new C-Star domains"
  license: Apache-2.0
  open_access: true
  github: https://github.com/CWorthy-Ocean/cstar-forge

  toc:
    - file: README.md
    - file: docs/overview.md
    - file: docs/releases.md

    - title: Get Started
      children:
        - file: docs/installation.md
        - file: docs/machine-config.md

    - title: Domain Generation
      children:
        - file: docs/domain-generation-overview.md

    - title: SourceData
      children:
        - file: docs/source-data-intro.md
        - file: docs/source-data-example.md
        - file: docs/source-data-developer.md

    - title: InputData
      children:
        - file: docs/InputData-intro.md
        - file: docs/InputData-RomsMarblInputData.md

    - title: ModelSpec
      children:
        - file: docs/model-spec-intro.md
        - file: docs/model-spec-settings.md
        - file: docs/model-spec-example.ipynb

    - title: Catalog
      children:
        - file: docs/catalog.ipynb

    - title: Skill Assessment (legacy)
      children:
        - pattern: legacy/workflows/skill-assessment/outputs/papermill/*

    - title: Visualization (legacy)
      children:
        - pattern: legacy/workflows/visualization/outputs/papermill/*

    - title: Developer
      children:
        - file: docs/developer-guide.md
        - file: docs/roms-tools-contributor-guide.md

    - title: Reference
      children:
        - file: docs/reference-machines.md
        - file: docs/reference-models-yml.md
        - file: docs/reference-domains.md
        - file: docs/reference-roms-marbl-blueprint.md
        - file: docs/reference-roms-marbl-blueprint-settings.md
site:
  template: book-theme
  options:
    favicon: favicon.ico
    logo: cworthy-logo.png
  actions:
    - title: "[C]Worthy"
      url: https://cworthy.org
