# rattler-build (v1) recipe for cstar-forge.
#
# STATUS: NOT YET SUBMITTABLE. See SUBMISSION.md in this directory for what's
# blocking a staged-recipes PR. In particular:
#   - `source.url` / `source.sha256` below are PLACEHOLDERS: cstar-forge has not
#     been released to PyPI yet, so there is no real sdist to point at.
#   - The `cstar-ocean` run dependency has no conda-forge feedstock yet.
#
# Once a real cstar-forge release exists on PyPI, regenerate `version`/`sha256`
# from that release (e.g. via `grayskull pypi cstar-forge` or manually from the
# PyPI JSON API) before opening a staged-recipes PR.

schema_version: 1

context:
  # TODO: placeholder version — no cstar-forge release exists on PyPI yet.
  version: "0.1.0"
  python_min: "3.12"

package:
  name: cstar-forge
  version: ${{ version }}

source:
  # TODO: placeholder URL + sha256. Replace with the real sdist URL and its
  # sha256 once cstar-forge has a first PyPI release (see SUBMISSION.md).
  url: https://pypi.org/packages/source/c/cstar-forge/cstar_forge-${{ version }}.tar.gz
  sha256: "PLACEHOLDER_SHA256_REPLACE_WITH_REAL_64_CHAR_HEX_DIGEST_ONCE_RELEASED"

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools_scm >=8
  run:
    - python >=${{ python_min }}
    # -- mirrors [project.dependencies] in pyproject.toml --
    - jinja2
    - pandas
    - pyyaml >=6.0
    - copernicusmarine
    - gdown
    - dask
    - distributed
    - threadpoolctl
    - fsspec
    - pydantic
    - numpy
    - xarray
    - nbformat
    - psutil
    # BLOCKED: cstar-ocean (PyPI: cstar-ocean, import: cstar) has no conda-forge
    # feedstock as of writing. This line will not resolve on conda-forge until
    # that feedstock is created and published — see SUBMISSION.md.
    - cstar-ocean >=0.7
    # roms_tools/roms-tools is on conda-forge already.
    - roms_tools >=4.0.0,<5

tests:
  - script:
      - python -c "import cstar_forge"
      - pip check
    requirements:
      run:
        - pip

about:
  homepage: https://github.com/CWorthy-ocean/cstar-forge
  summary: Generates regional oceanographic modeling domains and reproducible C-Star workflows
  description: |
    C-STAR Forge generates regional oceanographic modeling domains and
    reproducible C-Star workflows. It automates the creation of ROMS-MARBL
    domains by producing all required input files (grids, initial conditions,
    forcing, boundaries, rivers, tidal forcing) from observational and
    reanalysis datasets.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - TODO_ADD_GITHUB_USERNAME
