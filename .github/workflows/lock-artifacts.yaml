name: Export Lock Artifacts

# Renders plain conda/pip consumption artifacts (conda explicit spec +
# pinned pypi requirements.txt, per platform) from pixi.lock via
# scripts/export-lock-artifacts.py. Always uploaded as a workflow artifact;
# additionally attached to the GitHub release when triggered by one, so
# non-pixi consumers (see docs/installation.md) have something to download.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script dependency (pyyaml)
        run: python -m pip install pyyaml

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.76.1
          cache: true

      - name: Export lock artifacts (dev environment)
        run: python scripts/export-lock-artifacts.py --env dev --outdir lock-artifacts

      - name: Upload lock artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lock-artifacts
          path: lock-artifacts/

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" lock-artifacts/* --clobber
