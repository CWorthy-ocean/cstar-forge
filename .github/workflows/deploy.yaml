# The Forge documentation lives in the C-Star docs now
# (https://c-star.readthedocs.io/en/latest/forge/). This repository's GitHub
# Pages site is a static redirect there, so old bookmarks keep working.
name: GitHub Pages redirect

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/redirect'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
