templates:
  compile_time:
    location: "templates/compile-time"
    filter:
      files:
      - cppdefs.opt.j2

  run_time:
    location: "templates/run-time"
    filter:
      files:
      - marbl_in

settings:
  properties:
    n_tracers: 34
    marbl: true
  compile_time:
    _default_config_yaml: "templates/compile-time-defaults.yml"
  run_time:
    _default_config_yaml: "templates/run-time-defaults.yml"

code:
  roms:
    location: https://github.com/CWorthy-ocean/ucla-roms.git
    commit: "0.2.0"

  marbl:
    location: https://github.com/marbl-ecosys/MARBL.git
    commit: marbl0.45.0

inputs:
  grid:
    topography_source: ETOPO5

  initial_conditions:
    source:
      name: GLORYS
      glorys_layout: global
    bgc_source:
      name: UNIFIED
      climatology: true
    # Applies to the whole InitialConditions object (sibling of source/bgc_source),
    # not inside a source block.
    bgc_interpolation_method: density_mld

  forcing:
    surface:
      - source:
          name: ERA5
        type: physics
        correct_radiation: true
        coarse_grid_mode: "never"
      - source:
          name: UNIFIED
          climatology: true
        type: bgc
        coarse_grid_mode: "never"
      - source:
          name: MBL_co2
        type: bgc
        coarse_grid_mode: "never"

      - source:
           name: WOA
           climatology: true
        restoring_forces: ['sss']
        type: restoring
        coarse_grid_mode: "never"

    boundary:
      - source:
          name: GLORYS
          glorys_layout: global
        type: physics
      - source:
          name: UNIFIED
          climatology: true
        type: bgc
        # Density-space vertical interpolation for the BGC boundary; cstar-forge passes
        # the physics BoundaryForcing (generated just above) as physics_forcing.
        bgc_interpolation_method: density_mld

    tidal:
      - source:
          name: TPXO
        ntides: 15


    # River discharge from GLOFAS with river BGC export from RIVR2O (filled with the
    # CONSTANTS defaults). GLOFAS/RIVR2O are user-path datasets — set `path` to the
    # actual files on the run machine (edit these paths before running).
    river:
      - source:
          name: GLOFAS
          climatology: false
          path: /anvil/projects/x-ees250129/Datasets/Rivers/processed_GloFAS/glofas_v4_rivers_daily.nc  # EDIT ME
        include_bgc: true
        bgc_source:
          name: RIVR2O
          path: /anvil/projects/x-ees250129/Datasets/Rivers/r2o_river_inputs/rivr2o_riverinputs_*.nc  # EDIT ME
          fill:
            name: CONSTANTS

