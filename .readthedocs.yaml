# The Forge documentation is part of the C-Star docs
# (https://c-star.readthedocs.io/en/latest/forge/). This project only serves a
# redirect page so links to the old cstar-forge site keep resolving.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp docs/redirect/index.html docs/redirect/404.html $READTHEDOCS_OUTPUT/html/
