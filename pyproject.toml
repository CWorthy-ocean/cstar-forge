[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cstar-forge"
dynamic = ["version"]
description = "Compatibility shim: C-Star Forge now ships inside cstar-ocean (cstar.applications.forge)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "C-Worthy Ocean"}
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# The whole of C-Star Forge lives in cstar-ocean from 0.15.0 on; this package only
# forwards the old ``cstar_forge.*`` import paths to it. No ``cstar.cli`` /
# ``cstar.applications`` entry points: the core ``cstar forge`` command is the real
# one, and a plugin of the same name would be skipped by C-Star as a conflict.
dependencies = [
    "cstar-ocean>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/CWorthy-ocean/cstar-forge"
Documentation = "https://c-star.readthedocs.io/en/latest/forge/index.html"
"C-Star" = "https://github.com/CWorthy-ocean/C-Star"

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit>=3.8",
    "ruff>=0.12.2",
    # ci/ release-notes scripts and their tests
    "requests",
    "packaging",
]

[tool.setuptools_scm]
fallback_version = "0.9.0"

[tool.setuptools]
packages = ["cstar_forge"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
fix = true
show-fixes = true
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "E", "W", "F", "D", "RUF", "UP", "TCH"]
ignore = [
    "E501",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D205", "D400", "D401",
    "RUF043", "RUF059",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
